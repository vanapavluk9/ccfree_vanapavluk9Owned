name: Render dog
on:
  workflow_dispatch:
  push:
    paths: ["dog.py"]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 libxfixes3 libegl1
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar xf blender-4.2.3-linux-x64.tar.xz
      - name: Render
        run: blender-4.2.3-linux-x64/blender -b -P dog.py
      - uses: actions/upload-artifact@v4
        with:
          name: dog-video
          path: out/*.mp4
